<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Three people's availability bars; where they meet (the shared moment) lights up in gold. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <clipPath id="shared"><rect x="0" y="28" width="64" height="11"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="7" y="28" width="50" height="11" rx="5.5" fill="#fff" fill-opacity=".16"/>
  <g fill="#fff" fill-opacity=".7">
    <rect x="13" y="10" width="10" height="34" rx="5"/>
    <rect x="27" y="21" width="10" height="33" rx="5"/>
    <rect x="41" y="14" width="10" height="28" rx="5"/>
  </g>
  <g fill="#fbbf24" clip-path="url(#shared)">
    <rect x="13" y="10" width="10" height="34" rx="5"/>
    <rect x="27" y="21" width="10" height="33" rx="5"/>
    <rect x="41" y="14" width="10" height="28" rx="5"/>
  </g>
</svg>
